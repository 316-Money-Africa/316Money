# CI: every push and pull request is validated before the site can ship.
# Deployment is handled by Cloudflare itself (Workers Builds, connected to this repo), which publishes
# only apps/marketing-web as configured in wrangler.jsonc. No Cloudflare credentials live in GitHub.
# Architecture docs and the SRS are never deployed.
name: ci-cd

on:
  push:
  pull_request:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Required files present
        run: |
          test -f apps/marketing-web/index.html
          test -f apps/marketing-web/features.html
          test -f apps/marketing-web/send-and-receive.html
          test -f apps/marketing-web/request-money.html
          test -f apps/marketing-web/currency-wallets.html
          test -f apps/marketing-web/saving-pots.html
          test -f apps/marketing-web/cards.html
          test -f apps/marketing-web/virtual-cards.html
          test -f apps/marketing-web/gift-cards.html
          test -f apps/marketing-web/airtime-top-up.html
          test -f apps/marketing-web/bill-payment.html
          test -f apps/marketing-web/pay-with-316.html
          test -f apps/marketing-web/accept-online-payments.html
          test -f apps/marketing-web/business.css
          test -f apps/marketing-web/styles.css
      - name: Images must be compressed (WebP, no large raw PNG/JPG)
        run: |
          big=$(find apps/marketing-web \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) -size +60k)
          if [ -n "$big" ]; then echo "Uncompressed images found (run tools/optimize-images.mjs):"; echo "$big"; exit 1; fi
          total=$(find apps/marketing-web/assets -type f \( -name '*.webp' -o -name '*.png' -o -name '*.svg' \) -exec wc -c {} + | tail -1 | awk '{print $1}')
          echo "asset weight: $total bytes"
          if [ "$total" -gt 12582912 ]; then echo "Total asset weight above 12 MB"; exit 1; fi
          for d in apps/marketing-web/assets/*/; do
            w=$(find "$d" -type f -exec wc -c {} + | tail -1 | awk '{print $1}')
            echo "$d $w bytes"
            if [ "$w" -gt 3145728 ]; then echo "Page asset folder above 3 MB: $d"; exit 1; fi
          done
      - name: Generated pages are up to date
        run: |
          node tools/build-pages.mjs
          git diff --exit-code -- apps/marketing-web/*.html || { echo "Run node tools/build-pages.mjs and commit the result"; exit 1; }
      - name: No secrets in site output
        run: |
          if grep -rEIl "(BEGIN [A-Z ]*PRIVATE KEY|CLOUDFLARE_API_TOKEN|sk_live_|AKIA[0-9A-Z]{16})" apps/marketing-web; then
            echo "Secret-like content found in published directory"; exit 1
          fi
